name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Preserve each main commit's quality evidence; cancel only superseded PR runs.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
        racket-version: ['9.3', '9.0']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-glaze
        with:
          racket-version: ${{ matrix.racket-version }}
          linux-webview-deps: 'false'

      - name: Run tests
        env:
          # Hosted macOS runners have no menu bar for NSStatusItem; the
          # native tray construction is covered by local/self-hosted runs.
          GLAZE_TEST_NO_TRAY: ${{ runner.os == 'macOS' && '1' || '' }}
        run: raco test glaze-test/

      - name: License compliance gate
        if: matrix.os == 'ubuntu-24.04' && matrix.racket-version == '9.3'
        shell: bash
        run: |
          # Fails closed (exit 1) on any rejected/unknown third-party license.
          raco glaze compliance --json --out "$RUNNER_TEMP/compliance"
          test -s "$RUNNER_TEMP/compliance/glaze-sbom.cdx.json"
          test -s "$RUNNER_TEMP/compliance/glaze-notices.txt"

      - name: Release version preflight
        if: matrix.os == 'ubuntu-24.04' && matrix.racket-version == '9.3'
        shell: bash
        run: raco glaze check-release-version --json

      - name: Build Scribble documentation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glaze-doc"
          # Render from outside the repository: `raco setup` renders from the
          # package directory, so document assets must not depend on the cwd.
          scribble_src="$GITHUB_WORKSPACE/glaze-doc/scribblings/glaze.scrbl"
          cd "$RUNNER_TEMP"
          raco scribble ++xref-in setup/xref load-collections-xref \
            --htmls --dest "$RUNNER_TEMP/glaze-doc" \
            "$scribble_src"
          test -s "$RUNNER_TEMP/glaze-doc/glaze/index.html"
          test -s "$RUNNER_TEMP/glaze-doc/glaze/glaze-architecture.svg"

      - name: Check formatting
        if: matrix.os == 'ubuntu-24.04' && matrix.racket-version == '9.3'
        shell: bash
        run: |
          raco pkg install --auto --no-docs fmt
          python - <<'PY'
          from pathlib import Path
          import subprocess

          for root in ("glaze", "glaze-cli", "glaze-test"):
              for path in Path(root).rglob("*.rkt"):
                  subprocess.run(["raco", "fmt", "-i", str(path)], check=True)
          PY
          git diff --exit-code -- glaze glaze-cli glaze-test

  matrix:
    # Fold the per-platform acceptance evidence into the G4 cross-platform
    # conformance matrix (docs/1.0-plan.md). Fails closed if any leg failed
    # or a platform's evidence is missing — rivet `matrix` parity. The
    # evidence comes from webview-e2e, where the native WebView runtime is
    # present on every OS (the headless test job has no Linux WebView deps).
    needs: [webview-e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-glaze
        with:
          racket-version: '9.3'
          linux-webview-deps: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-*
          path: acceptance-reports

      - name: Fold the cross-platform acceptance matrix
        shell: bash
        run: |
          set -euo pipefail
          for os in Linux Windows macOS; do
            test -f "acceptance-reports/acceptance-$os/acceptance.json"
          done
          raco glaze matrix acceptance-reports/*/acceptance.json \
            --json --out glaze-acceptance-matrix.json
          test -s glaze-acceptance-matrix.json

      - name: Upload acceptance matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glaze-acceptance-matrix
          path: glaze-acceptance-matrix.json
          if-no-files-found: error

  webview-e2e:
    # Real-window WebView end-to-end on each OS: open -> load (title
    # commits) -> capture -> navigate -> close -> on-close. Windows needs
    # nothing extra (WebView2 runtime is preinstalled); Linux runs under
    # Xvfb with the WebKitGTK packages.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
        racket-version: ['9.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-glaze
        with:
          racket-version: ${{ matrix.racket-version }}

      - name: Probe webview libraries (Linux debug)
        if: runner.os == 'Linux'
        run: ldconfig -p | grep -E "libgtk-3|libwebkit2gtk|libglib-2.0|libgdk_pixbuf" | head -10

      - name: Run webview e2e
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          # Exercise the acceptance-only autoplay hatch on every platform so
          # its code path (bindings + logging) is covered by upstream CI.
          GLAZE_ALLOW_PROGRAMMATIC_PLAYBACK: '1'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a racket scripts/webview-e2e.rkt
          else
            racket scripts/webview-e2e.rkt
          fi

      - name: Run agent-native diagnosis and verification
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          raco glaze init agent-smoke
          cd agent-smoke
          test -f AGENTS.md
          test -f verify.rkt
          test -f glaze.rktd
          test -f glaze-schema.json
          raco glaze schema check --json > schema.json
          raco glaze inspect --json > inspect.json
          python - <<'PY'
          import json
          with open("inspect.json", encoding="utf-8") as source:
              report = json.load(source)
          assert report["contract-version"] == 1
          assert report["application"]["instructions"]["exists"] is True
          assert report["schema"]["status"] == "ready"
          PY
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a raco glaze doctor --json
            xvfb-run -a raco glaze verify
          else
            raco glaze doctor --json
            raco glaze verify
          fi

      - name: Acceptance evidence
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GLAZE_ALLOW_PROGRAMMATIC_PLAYBACK: '1'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a raco glaze acceptance --json --out "$RUNNER_TEMP/acceptance.json"
          else
            raco glaze acceptance --json --out "$RUNNER_TEMP/acceptance.json"
          fi

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ runner.os }}
          path: ${{ runner.temp }}/acceptance.json
          if-no-files-found: error

  example:
    # The maintained Taskboard example is a consumer of the public API; keep
    # its tests, schema contract, native window and build green on every OS.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
        racket-version: ['9.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-glaze
        with:
          racket-version: ${{ matrix.racket-version }}

      - name: Run example tests
        working-directory: examples/taskboard
        shell: bash
        run: raco test tests/*.rkt

      - name: Check the example schema contract
        working-directory: examples/taskboard
        run: raco glaze schema check --json

      - name: Native acceptance
        working-directory: examples/taskboard
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
          GLAZE_NO_STARTUP_DIALOG: '1'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a raco glaze verify
          else
            raco glaze verify
          fi

      - name: Build the example
        working-directory: examples/taskboard
        shell: bash
        run: raco glaze build --name taskboard --version 0.1.0 --out dist-example

  package:
    # Build a sample app with `raco glaze build --installer` on each platform
    # and upload the resulting distribution + installer as artifacts.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-26]
        racket-version: ['9.3']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-glaze
        with:
          racket-version: ${{ matrix.racket-version }}
          linux-webview-deps: 'false'

      - name: Install installer toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libgtk-3-dev rpm
          # AppImage tooling (optional; build falls back to other formats if missing)
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install installer toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          # Pin the same WiX release used by the tag-release workflow.
          dotnet tool install --global wix --version 5.0.2
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Scaffold and build a sample app
        shell: bash
        run: |
          raco glaze init sampleapp
          cd sampleapp
          test -f AGENTS.md
          test -f verify.rkt
          test -f glaze.rktd
          test -f glaze-schema.json
          raco glaze schema check --json > schema.json
          raco glaze inspect --json > inspect.json
          python - <<'PY'
          import json
          with open("inspect.json", encoding="utf-8") as source:
              report = json.load(source)
          assert report["contract-version"] == 1
          assert report["application"]["entry"]["exists"] is True
          assert report["schema"]["status"] == "ready"
          PY
          # --sign - exercises the signing pipeline everywhere: macOS signs
          # the bundle ad-hoc (verifiable without a cert); Windows/Linux
          # degrade with a loud warning when no signing toolchain exists.
          raco glaze build --name sampleapp --version 0.0.1 \
            --publisher "Turing Lambda" --identifier TuringLambda.Glaze.CISample \
            --out dist --installer --sign -
          # The WebView loader is loaded via an absolute package-tree path,
          # so raco distribute cannot trace it; assert the staged copy so a
          # regression cannot ship an app whose WebView fails at startup
          # while CI stays green.
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f dist/WebView2Loader.dll
          fi
          # Every native Linux format must actually be produced and valid;
          # a green build with a missing package format is the same silent
          # hole the WebView loader assertion closes. (cwd is sampleapp/.)
          # Outputs are captured to files first: `grep -q` exits on the
          # first match, and under the runner's default pipefail the
          # EPIPE-killed producer would fail the step even on a good
          # package.
          if [ "$RUNNER_OS" = "Linux" ]; then
            test -f dist/sampleapp.deb
            test -f dist/sampleapp.rpm
            test -f dist/sampleapp.AppImage
            dpkg-deb --info dist/sampleapp.deb > "$RUNNER_TEMP/deb-info.txt"
            grep -q 'Package: sampleapp' "$RUNNER_TEMP/deb-info.txt"
            grep -q 'Version: 0.0.1' "$RUNNER_TEMP/deb-info.txt"
            dpkg-deb --contents dist/sampleapp.deb > "$RUNNER_TEMP/deb-contents.txt"
            grep -q 'usr/bin/sampleapp' "$RUNNER_TEMP/deb-contents.txt"
            grep -q 'usr/share/applications/sampleapp.desktop' "$RUNNER_TEMP/deb-contents.txt"
            rpm -qpl dist/sampleapp.rpm > "$RUNNER_TEMP/rpm-files.txt"
            grep -q 'usr/bin/sampleapp' "$RUNNER_TEMP/rpm-files.txt"
            grep -q 'usr/lib/sampleapp' "$RUNNER_TEMP/rpm-files.txt"
          fi

      - name: Install, upgrade and remove the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd sampleapp
          raco glaze build --name sampleapp --version 0.0.2 \
            --publisher "Turing Lambda" --identifier TuringLambda.Glaze.CISample \
            --out dist-next --installer
          sudo dpkg -i dist/sampleapp.deb
          test -x /usr/bin/sampleapp
          test -d /usr/lib/sampleapp
          test -f /usr/share/applications/sampleapp.desktop
          test "$(dpkg-query -W -f='${Version}' sampleapp)" = "0.0.1"
          sudo dpkg -i dist-next/sampleapp.deb
          test "$(dpkg-query -W -f='${Version}' sampleapp)" = "0.0.2"
          sudo dpkg -r sampleapp
          test ! -e /usr/lib/sampleapp
          test ! -e /usr/bin/sampleapp

      - name: Install, upgrade and erase the rpm on Fedora
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm             -v "$PWD/sampleapp/dist:/dist:ro"             -v "$PWD/sampleapp/dist-next:/dist-next:ro"             fedora:latest bash -euxo pipefail -c '
              dnf install -y /dist/sampleapp.rpm
              test -x /usr/bin/sampleapp
              test -d /usr/lib/sampleapp
              test -f /usr/share/applications/sampleapp.desktop
              test "$(rpm -q --qf "%{VERSION}" sampleapp)" = "0.0.1"
              dnf install -y /dist-next/sampleapp.rpm
              test "$(rpm -q --qf "%{VERSION}" sampleapp)" = "0.0.2"
              dnf remove -y sampleapp
              test ! -e /usr/lib/sampleapp
              test ! -e /usr/bin/sampleapp
            '

      - name: Launch the AppImage under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y libwebkit2gtk-4.1-0 xvfb
          chmod +x sampleapp/dist/sampleapp.AppImage
          set +e
          timeout 10 xvfb-run -a sampleapp/dist/sampleapp.AppImage \
            --appimage-extract-and-run > "$RUNNER_TEMP/appimage.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$RUNNER_TEMP/appimage.log"
            echo "AppImage exited before the timeout (status $status)" >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/appimage.log"

      - name: Zero-env cold launch + packaged invoke/SSE acceptance (glaze#131, G4)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # glaze#131: the packaged launcher pins (find-system-path 'pref-dir)
          # inside the read-only install payload, so the first settings/state
          # write died with EROFS on a plain `apt install` + launch. Release
          # smokes masked it with product data-dir env overrides. Phase 1
          # installs the deb and launches the INSTALLED binary with the
          # masking XDG variables stripped: it must survive, and the state
          # file must land under $HOME/.config — never inside /usr/lib.
          #
          # G4 packaged gate: phase 2 drives a typed invoke, a typed
          # invalid-args rejection, and an SSE round trip through the real
          # bridge of the installed app (scripts/coldsmoke). The page
          # confirms each fact, the app writes a JSON acceptance report and
          # quits — a miniature executable acceptance manifest in the spirit
          # of rivet's rivet-acceptance.rktd.
          cp -r scripts/coldsmoke "$RUNNER_TEMP/coldsmoke"
          cd "$RUNNER_TEMP/coldsmoke"
          raco glaze schema check --json
          raco glaze build --name coldsmoke --version 0.0.1 \
            --publisher "Turing Lambda" --identifier dev.glaze.coldsmoke \
            --out dist --installer
          sudo dpkg -i dist/coldsmoke.deb
          test -x /usr/bin/coldsmoke
          # Phase 1 — zero-env cold launch.
          set +e
          timeout 15 xvfb-run -a \
            env -u XDG_CONFIG_HOME -u XDG_DATA_HOME -u XDG_CACHE_HOME \
            /usr/bin/coldsmoke > "$RUNNER_TEMP/coldsmoke.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            cat "$RUNNER_TEMP/coldsmoke.log"
            echo "installed coldsmoke exited before the timeout (status $status)" >&2
            exit 1
          fi
          test -f "$HOME/.config/glaze/dev.glaze.coldsmoke/window-state.json"
          # Phase 2 — packaged typed invoke + SSE acceptance report.
          rm -f "$RUNNER_TEMP/coldsmoke-report.json"
          set +e
          timeout 60 xvfb-run -a \
            env GLAZE_ACCEPTANCE_REPORT="$RUNNER_TEMP/coldsmoke-report.json" \
            /usr/bin/coldsmoke > "$RUNNER_TEMP/coldsmoke-accept.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat "$RUNNER_TEMP/coldsmoke-accept.log"
            echo "acceptance run did not exit cleanly (status $status)" >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "coldsmoke-report.json")
          report = json.load(open(path, encoding="utf-8"))
          assert report["ok"] is True, report
          assert report["checks"] == {
              "typed-ok": "hello",
              "invalid-rejected": "invalid-args",
              "sse": "pong",
          }, report
          PY
          sudo dpkg -r coldsmoke

      - name: Validate Windows installer upgrade identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $first = (Resolve-Path 'sampleapp/dist/sampleapp.msi').Path
          wix msi validate $first
          Push-Location sampleapp
          raco glaze build `
            --name sampleapp `
            --version 0.0.2 `
            --publisher 'Turing Lambda' `
            --identifier TuringLambda.Glaze.CISample `
            --out dist-next `
            --installer
          Pop-Location
          $second = (Resolve-Path 'sampleapp/dist-next/sampleapp.msi').Path
          wix msi validate $second
          $firstWxs = Join-Path $env:RUNNER_TEMP 'sampleapp-0.0.1.wxs'
          $secondWxs = Join-Path $env:RUNNER_TEMP 'sampleapp-0.0.2.wxs'
          wix msi decompile $first -o $firstWxs
          wix msi decompile $second -o $secondWxs
          [xml] $firstXml = Get-Content -Raw $firstWxs
          [xml] $secondXml = Get-Content -Raw $secondWxs
          $firstPackage = $firstXml.Wix.Package
          $secondPackage = $secondXml.Wix.Package
          if ($firstPackage.UpgradeCode -ne $secondPackage.UpgradeCode) {
            throw 'UpgradeCode changed between consecutive versions'
          }
          if ($firstPackage.ProductCode -eq $secondPackage.ProductCode) {
            throw 'ProductCode did not change between consecutive versions'
          }
          if ($secondPackage.Version -ne '0.0.2') {
            throw "unexpected MSI version: $($secondPackage.Version)"
          }
      - name: Install, upgrade and uninstall the MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Msi([string]$path) {
            $proc = Start-Process msiexec.exe -ArgumentList @('/i', "`"$path`"", '/qn', '/norestart') -Wait -PassThru
            if ($proc.ExitCode -notin @(0, 3010)) {
              throw "msiexec install failed ($($proc.ExitCode)): $path"
            }
          }
          function Find-Product {
            @(Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              Where-Object { $_.GetValue('DisplayName') -eq 'sampleapp' })
          }
          $first = (Resolve-Path 'sampleapp/dist/sampleapp.msi').Path
          $second = (Resolve-Path 'sampleapp/dist-next/sampleapp.msi').Path
          $installDir = 'C:\Program Files\sampleapp'
          $startMenuShortcut = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'sampleapp\sampleapp.lnk'
          $publicDesktopShortcut = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'sampleapp.lnk'
          $userDesktopShortcut = Join-Path ([Environment]::GetFolderPath('DesktopDirectory')) 'sampleapp.lnk'
          try {
            Invoke-Msi $first
            if (-not (Test-Path "$installDir\sampleapp.exe")) {
              throw 'MSI did not install sampleapp.exe'
            }
            if (-not (Test-Path $startMenuShortcut)) { throw 'MSI did not create all-users Start Menu shortcut' }
            if ((Test-Path $publicDesktopShortcut) -or (Test-Path $userDesktopShortcut)) {
              throw 'MSI created an unsolicited desktop shortcut'
            }
            $entries = Find-Product
            if ($entries.Count -ne 1) { throw "expected one uninstall entry, got $($entries.Count)" }
            if ($entries[0].GetValue('DisplayVersion') -ne '0.0.1') {
              throw "unexpected installed version: $($entries[0].GetValue('DisplayVersion'))"
            }
            Invoke-Msi $second
            $entries = Find-Product
            if ($entries.Count -ne 1) {
              throw "upgrade left $($entries.Count) uninstall entries"
            }
            if ($entries[0].GetValue('DisplayVersion') -ne '0.0.2') {
              throw "upgrade did not update DisplayVersion: $($entries[0].GetValue('DisplayVersion'))"
            }
            $productCode = $entries[0].PSChildName
            $uninstall = Start-Process msiexec.exe -ArgumentList @('/x', $productCode, '/qn', '/norestart') -Wait -PassThru
            if ($uninstall.ExitCode -notin @(0, 3010)) {
              throw "msiexec uninstall failed ($($uninstall.ExitCode))"
            }
            if (Test-Path $installDir) { throw 'uninstall left the install directory' }
            if ((Find-Product).Count -ne 0) { throw 'uninstall left an uninstall entry' }
            if (Test-Path $startMenuShortcut) { throw 'uninstall left the Start Menu shortcut' }
          } finally {
            foreach ($entry in (Find-Product)) {
              Start-Process msiexec.exe -ArgumentList @('/x', $entry.PSChildName, '/qn', '/norestart') -Wait | Out-Null
            }
          }

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install and uninstall the NSIS fallback
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GLAZE_NSIS_SMOKE: '1'
        run: racket scripts/nsis-smoke.rkt

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: |
          codesign --verify --strict sampleapp/dist/sampleapp.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" sampleapp/dist/sampleapp.app/Contents/Info.plist | grep -qx "0.0.1"

      - name: Mount dmg and verify the install layout
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$PWD/sampleapp/dist/sampleapp.dmg"
          test -f "$dmg"
          attach="$(hdiutil attach "$dmg" -nobrowse -readonly)"
          mount_point="$(printf '%s\n' "$attach" | tail -1 | awk -F'\t' '{print $NF}')"
          test -d "$mount_point"
          trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
          test -d "$mount_point/sampleapp.app"
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = "/Applications"
          mkdir -p "$RUNNER_TEMP/Applications"
          ditto "$mount_point/sampleapp.app" "$RUNNER_TEMP/Applications/sampleapp.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "$RUNNER_TEMP/Applications/sampleapp.app/Contents/Info.plist" | grep -qx "0.0.1"
          test -x "$RUNNER_TEMP/Applications/sampleapp.app/Contents/MacOS/sampleapp"
          hdiutil detach "$mount_point"
          trap - EXIT

      - name: Record packaged size (informational)
        shell: bash
        run: |
          cd sampleapp
          # G4-S2 baseline evidence: what a built sample app weighs on this
          # runner. Recorded per platform/revision; no thresholds — the
          # release workflow gates sizes with budgets.json.
          raco glaze measure size

      - name: Upload distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glaze-${{ runner.os }}-dist
          path: |
            sampleapp/dist/
            sampleapp/*.zip
            sampleapp/*.tar.gz
            sampleapp/dist/*.msi
            sampleapp/dist/*.dmg
            sampleapp/dist/*.AppImage
