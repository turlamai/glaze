name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Validate and build source release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate annotated tag and main provenance
        shell: bash
        run: |
          set -euo pipefail
          # actions/checkout resolves a tag event to GITHUB_SHA and may replace
          # the local refs/tags/<name> with that peeled commit. Fetch the real
          # remote tag into a private namespace before inspecting its object.
          release_tag_ref="refs/release-tags/$GITHUB_REF_NAME"
          git fetch --force origin \
            "refs/tags/$GITHUB_REF_NAME:$release_tag_ref"
          if [[ "$(git cat-file -t "$release_tag_ref")" != "tag" ]]; then
            echo "release tag must be annotated" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$release_tag_ref^{}")" != "$GITHUB_SHA" ]]; then
            echo "release tag does not point at the workflow commit" >&2
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "release commit must be part of origin/main" >&2
            exit 1
          fi

      - name: Check release signing readiness
        shell: bash
        env:
          GLAZE_REQUIRE_SIGNED_INSTALLERS: ${{ vars.GLAZE_REQUIRE_SIGNED_INSTALLERS }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
          WINDOWS_SIGN_IDENTITY: ${{ secrets.WINDOWS_SIGN_IDENTITY }}
        run: bash scripts/check-release-signing.sh

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: '9.3'

      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^(define version "\([^"]*\)")/\1/p' info.rkt)"
          release_version="$(sed -n 's/^(define release-version "\([^"]*\)")/\1/p' info.rkt)"
          if ! racket -e '(require version/utils) (exit (if (valid-version? (vector-ref (current-command-line-arguments) 0)) 0 1))' "$package_version"; then
            echo "info.rkt version $package_version is not a valid Racket package version" >&2
            exit 1
          fi
          if [[ "$tag_version" != "$release_version" ]]; then
            echo "tag version $tag_version does not match release-version $release_version" >&2
            exit 1
          fi
          if ! grep -Eq "^## \\[$release_version\\]( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no $release_version section" >&2
            exit 1
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "GLAZE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Install and test Glaze
        shell: bash
        run: |
          set -euo pipefail
          raco pkg install --auto --no-docs --name glaze --link "$PWD"
          raco test --package glaze
          raco scribble ++xref-in setup/xref load-collections-xref \
            --htmls --dest "$RUNNER_TEMP/glaze-doc" \
            glaze-doc/scribblings/glaze.scrbl

      - name: Build source package and release notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets package-dist
          raco pkg create --from-dir --source --format zip --dest package-dist "$PWD"
          archive="$(find package-dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          destination="release-assets/glaze-${GLAZE_VERSION}.zip"
          mv "$archive" "$destination"
          sha256sum "$destination" > "${destination}.sha256"
          awk -v version="$GLAZE_VERSION" '
            $0 ~ ("^## \\[" version "\\]") { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > release-assets/release-notes.md
          test -s release-assets/release-notes.md

      - name: Smoke-test exact source package
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          export PLTUSERHOME="$smoke_root/racket-user"
          raco pkg install --auto --no-docs --name glaze \
            "$PWD/release-assets/glaze-${GLAZE_VERSION}.zip"
          PLTUSERHOME="$smoke_root/racket-user" \
            racket -e '(for ([m (quote (glaze
                                        glaze/core
                                        glaze/window
                                        glaze/services
                                        glaze/distribution
                                        glaze/devtools
                                        glaze/experimental))])
                         (dynamic-require m #f))'
          PLTUSERHOME="$smoke_root/racket-user" raco glaze help >/dev/null
          cd "$smoke_root"
          PLTUSERHOME="$smoke_root/racket-user" raco glaze init schema-smoke
          cd schema-smoke
          PLTUSERHOME="$smoke_root/racket-user" raco glaze schema check --json \
            > schema-report.json
          python - <<'PY'
          import json
          with open("schema-report.json", encoding="utf-8") as source:
              report = json.load(source)
          assert report["ok"] is True
          assert report["compatible"] is True
          PY

      - name: Inventory the source package contents
        shell: bash
        run: |
          set -euo pipefail
          # The declared public surface must physically ship in the exact
          # artifact the smoke just installed: every supported public
          # module, the G3-S2 private owners behind them, the CLI, and the
          # package metadata that carries the version (upgrade identity).
          python - <<'PY'
          import json, subprocess, sys, zipfile

          zip_path = "release-assets/glaze-%s.zip" % __import__("os").environ["GLAZE_VERSION"]
          names = set(zipfile.ZipFile(zip_path).namelist())

          required = [
              "glaze/main.rkt", "glaze/core.rkt", "glaze/window.rkt",
              "glaze/services.rkt", "glaze/distribution.rkt",
              "glaze/devtools.rkt", "glaze/experimental.rkt",
              "glaze/private/id-allocator.rkt", "glaze/private/dialog-backend.rkt",
              "glaze/private/hotkey-backend.rkt", "glaze/private/win32-strings.rkt",
              "glaze/private/public-assets.rkt",
              "glaze-cli/cli.rkt", "info.rkt",
          ]
          missing = [m for m in required if not any(n.endswith(m) for n in names)]
          if missing:
              print("missing from source package:", missing, file=sys.stderr)
              sys.exit(1)
          print("package contents inventory: %d entries, all %d required paths present"
                % (len(names), len(required)))
          PY

      - name: Upload source release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: release-assets/
          if-no-files-found: error

  windows-installer:
    name: Build and validate Windows installer
    needs: source
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_SIGN_IDENTITY: ${{ secrets.WINDOWS_SIGN_IDENTITY }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: '9.3'

      - name: Install WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build Glaze showcase MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          raco pkg install --auto --no-docs --name glaze --link $PWD
          Push-Location examples/showcase
          $signing = @()
          if ($env:WINDOWS_SIGN_IDENTITY) {
            $signing += @('--sign', $env:WINDOWS_SIGN_IDENTITY)
          }
          raco glaze build `
            --name Glaze `
            --version '${{ needs.source.outputs.version }}' `
            --publisher 'Turing Lambda' `
            --identifier 'TuringLambda.Glaze' `
            --out dist `
            --installer @signing
          Pop-Location
          $msi = 'examples/showcase/dist/Glaze.msi'
          if (-not (Test-Path -LiteralPath $msi -PathType Leaf)) {
            throw "Glaze MSI was not produced: $msi"
          }
          wix msi validate $msi
          # G4-S2: record what the packaged app weighs against the showcase
          # budget file; a violation fails the release.
          Push-Location examples/showcase
          raco glaze measure size --budget budgets.json
          Pop-Location
          New-Item -ItemType Directory -Path release-assets | Out-Null
          $asset = "glaze-${{ needs.source.outputs.version }}-windows-x64.msi"
          Move-Item -LiteralPath $msi -Destination (Join-Path release-assets $asset)
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path release-assets $asset)).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -Encoding ascii (Join-Path release-assets "$asset.sha256")

      - name: Verify installer metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'release-assets/*.msi').Path
          $wxs = Join-Path $env:RUNNER_TEMP 'glaze-release.wxs'
          wix msi decompile $msi -o $wxs
          [xml] $xml = Get-Content -Raw $wxs
          $package = $xml.Wix.Package
          if ($package.Name -ne 'Glaze') { throw "unexpected MSI name: $($package.Name)" }
          if ($package.Manufacturer -ne 'Turing Lambda') {
            throw "unexpected MSI publisher: $($package.Manufacturer)"
          }
          if ($package.Version -ne '${{ needs.source.outputs.version }}') {
            throw "unexpected MSI version: $($package.Version)"
          }
          if (-not $package.ProductCode -or -not $package.UpgradeCode) {
            throw 'MSI is missing ProductCode or UpgradeCode'
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release-assets/
          if-no-files-found: error

  linux-packages:
    name: Build Linux packages
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: '9.3'

      - name: Install packaging toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install Glaze package
        run: raco pkg install --auto --no-docs --link "$PWD"

      - name: Build Glaze showcase packages
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = amd64
          cd examples/showcase
          raco glaze build \
            --name Glaze \
            --version '${{ needs.source.outputs.version }}' \
            --publisher 'Turing Lambda' \
            --identifier 'TuringLambda.Glaze' \
            --out dist \
            --installer
          test -f dist/Glaze.deb
          test -f dist/Glaze.rpm
          test -f dist/Glaze.AppImage
          # G4-S2: packaged-size budget gate (fails the release on violation).
          raco glaze measure size --budget budgets.json

      - name: Stage Linux release assets
        run: |
          set -euo pipefail
          version='${{ needs.source.outputs.version }}'
          mkdir -p release-assets
          mv "examples/showcase/dist/Glaze.deb" "release-assets/glaze-${version}-linux-amd64.deb"
          mv "examples/showcase/dist/Glaze.rpm" "release-assets/glaze-${version}-linux-x86_64.rpm"
          mv "examples/showcase/dist/Glaze.AppImage" "release-assets/glaze-${version}-linux-x86_64.AppImage"
          cd release-assets
          for f in glaze-${version}-linux-*; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Upload Linux release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: release-assets/
          if-no-files-found: error

  macos-dmg:
    name: Build macOS dmg
    needs: source
    runs-on: macOS-latest
    timeout-minutes: 25
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
      APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import Apple signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain             -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:             -s -k actions build.keychain

      - name: Store notary credentials
        if: env.APPLE_NOTARY_APPLE_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "$APPLE_NOTARY_PROFILE"             --apple-id "$APPLE_NOTARY_APPLE_ID"             --team-id "$APPLE_NOTARY_TEAM_ID"             --password "$APPLE_NOTARY_PASSWORD"

      # This release is explicitly named macos-arm64. A runner label
      # migration must fail instead of silently mislabeling an Intel DMG.
      - name: Assert Apple Silicon release runner
        shell: bash
        run: |
          test "$(uname -m)" = "arm64"

      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: '9.3'

      - name: Install Glaze package
        run: raco pkg install --auto --no-docs --link "$PWD"

      - name: Build Glaze showcase dmg
        run: |
          set -euo pipefail
          cd examples/showcase
          signing=()
          if [ -n "${APPLE_SIGN_IDENTITY:-}" ]; then
            signing+=(--sign "$APPLE_SIGN_IDENTITY")
          fi
          if [ -n "${APPLE_NOTARY_PROFILE:-}" ]; then
            signing+=(--notarize-profile "$APPLE_NOTARY_PROFILE")
          fi
          raco glaze build \
            --name Glaze \
            --version '${{ needs.source.outputs.version }}' \
            --publisher 'Turing Lambda' \
            --identifier 'TuringLambda.Glaze' \
            --out dist \
            --installer "${signing[@]}"
          test -f dist/Glaze.dmg
          # G4-S2: packaged-size budget gate (fails the release on violation).
          raco glaze measure size --budget budgets.json

      - name: Stage macOS release assets
        run: |
          set -euo pipefail
          version='${{ needs.source.outputs.version }}'
          mkdir -p release-assets
          mv "examples/showcase/dist/Glaze.dmg" "release-assets/glaze-${version}-macos-arm64.dmg"
          cd release-assets
          sha256sum "glaze-${version}-macos-arm64.dmg" > "glaze-${version}-macos-arm64.dmg.sha256"
          ls -la

      - name: Upload macOS release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [source, windows-installer, linux-packages, macos-dmg]
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify full source and showcase release matrix
        run: |
          set -euo pipefail
          version='${{ needs.source.outputs.version }}'
          cd release-assets
          : > SHA256SUMS
          for asset in \
            "glaze-$version.zip" \
            "glaze-$version-windows-x64.msi" \
            "glaze-$version-macos-arm64.dmg" \
            "glaze-$version-linux-amd64.deb" \
            "glaze-$version-linux-x86_64.rpm" \
            "glaze-$version-linux-x86_64.AppImage"; do
            test -s "$asset" && test -s "$asset.sha256" || {
              echo "::error::Missing or empty release asset/checksum: $asset"
              exit 1
            }
            sha256sum "$asset" >> SHA256SUMS
          done
          LC_ALL=C sort -k2 -o SHA256SUMS SHA256SUMS
          sha256sum -c SHA256SUMS
          test "$(grep -c '^' SHA256SUMS)" -eq 6

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version='${{ needs.source.outputs.version }}'
          cd release-assets
          gh release create "$GITHUB_REF_NAME" \
            "glaze-$version.zip" \
            "glaze-$version-windows-x64.msi" \
            "glaze-$version-macos-arm64.dmg" \
            "glaze-$version-linux-amd64.deb" \
            "glaze-$version-linux-x86_64.rpm" \
            "glaze-$version-linux-x86_64.AppImage" \
            SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Glaze $version" \
            --notes-file release-notes.md
