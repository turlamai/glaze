name: Setup Glaze
description: Install Racket, link this checkout as the Glaze package, and optionally add Linux WebView dependencies.

inputs:
  racket-version:
    description: Racket version to install
    default: '9.3'
  linux-webview-deps:
    description: Install GTK3, WebKitGTK and Xvfb on Linux
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install Racket
      uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
      with:
        version: ${{ inputs.racket-version }}

    - name: Install Glaze package
      shell: bash
      run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE"

    - name: Install WebView dependencies (Linux)
      if: runner.os == 'Linux' && inputs.linux-webview-deps == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb
